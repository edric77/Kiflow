<!DOCTYPE html>

<head>

<title>MAPS Diagnostic — KIFLOW EI</title>
<style>
  :root {

  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 1.5rem 1.25rem;
  }

    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.75;
    margin: 0 0 6px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .badge {
    font-size: 13px;
    font-weight: 500;
    color: var(--navy);
    background: var(--accent-bg);
    padding: 3px 10px;
    border-radius: 6px;
  }
  #lang-toggle {
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-primary);

  }

  p.subtitle { font-size: 13px; color: var(--text-muted); margin: 8px 0 2px; }
  p.hint { font-size: 12px; color: var(--text-muted); font-style: italic; margin: 0 0 14px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .legend span.item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #jumpnav {
    position: sticky; top: 0; background: var(--surface-0);
    z-index: 5; padding: 10px 0; margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  #jumpnav button {
    font-size: 12px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--border-strong); background: var(--surface-2);
    color: var(--text-primary); cursor: pointer;

  .pillar-title { font-size: 16px; font-weight: 600; margin: 24px 0 10px; color: var(--navy); }
  .indicator-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 16px 0 4px; }

    gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border);
  }
  .lab-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .lab { font-size: 13px; color: var(--text-secondary); cursor: help; }
  .qmark {
    flex-shrink: 0; width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid var(--border-strong); color: var(--text-muted);
    font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: help;
  }
  .seg { display: flex; gap: 4px; flex-shrink: 0; }
  .seg button {
    height: 22px; font-size: 10px; padding: 0 6px; border-radius: 6px;
    border: 1px solid var(--border-strong); background: var(--surface-2);
    color: var(--text-secondary); cursor: pointer;
  }
  .stats {
    background: var(--surface-1); border-radius: 8px; padding: 1rem;
    margin: 1.5rem 0 1rem; display: grid; grid-template-columns: repeat(4,1fr); gap: 8px;

  .stats .lbl { font-size: 12px; color: var(--text-secondary); margin: 0; }
  .stats .val { font-size: 20px; font-weight: 600; margin: 2px 0 0; }
  #footer-note { font-size: 12px; color: var(--text-muted); margin: 12px 0 0; }
  #red-flags p { font-size: 12px; margin: 0 0 2px; }
  footer.page-footer {
    max-width: 760px; margin: 0 auto; padding: 1rem 1.25rem 2rem;
    font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border);
  }
</style>
</head>

<header>
  <p class="brand">KIFLOW EI — Outil de diagnostic</p>

  <p id="footer-note"></p>

</main>

        m:{fr:"Vérifier les délais légaux de traitement des recours et leur respect effectif sur un échantillon de dossiers.",en:"Check the legal time limits for handling complaints and actual compliance on a sample of cases."}},
       {fr:"Indépendance et capacité de l'organe de recours",en:"Independence and capacity of the appeals body",
        m:{fr:"Vérifier la composition de l'organe de recours et son absence de lien hiérarchique avec les acheteurs.",en:"Check the composition of the appeals body and the absence of any hierarchical link with contracting authorities."}},
       {fr:"Décisions de l'organe de recours",en:"Decisions of the appeals body",
        m:{fr:"Vérifier la publication effective des décisions et la possibilité de recours judiciaire ultérieur.",en:"Check the actual publication of decisions and the availability of subsequent judicial review."}}
     ]},
     { name:{fr:"14. Mesures d'éthique et de lutte contre la corruption",en:"14. Existence of ethics and anti-corruption measures"}, subs:[
       {fr:"Définition légale des pratiques prohibées, conflits d'intérêts et sanctions",en:"Legal definition of prohibited practices, conflict of interest and associated penalties",
        m:{fr:"Vérifier que la loi définit précisément fraude, corruption, collusion et conflit d'intérêts, avec les sanctions associées.",en:"Check that the law precisely defines fraud, corruption, collusion and conflict of interest, with associated penalties."}},
       {fr:"Dispositions sur les pratiques prohibées dans les documents de passation",en:"Provisions on prohibited practices in procurement documents",
        m:{fr:"Vérifier que les dossiers de consultation types intègrent des clauses anti-corruption et des déclarations d'intégrité.",en:"Check that model tender documents include anti-corruption clauses and integrity declarations."}},
       {fr:"Sanctions effectives et mécanismes d'application",en:"Effective sanctions and enforcement systems",
        m:{fr:"Analyser les statistiques de sanctions prononcées et leur application effective sur les dernières années.",en:"Analyse statistics on sanctions issued and their actual enforcement over recent years."}},
       {fr:"Cadre anti-corruption et formation à l'intégrité",en:"Anti-corruption framework and integrity training",
        m:{fr:"Vérifier l'existence de modules de formation à l'intégrité, obligatoires pour les agents et si possible les fournisseurs.",en:"Check for integrity training modules, mandatory for staff and where possible for suppliers."}},
       {fr:"Soutien des parties prenantes au renforcement de l'intégrité",en:"Stakeholder support to strengthen integrity in procurement",
        m:{fr:"Mener des entretiens avec les parties prenantes pour évaluer leur perception de l'intégrité du système.",en:"Conduct stakeholder interviews to assess perceptions of the system's integrity."}},
       {fr:"Mécanisme sécurisé de signalement des pratiques prohibées",en:"Secure mechanism for reporting prohibited practices or unethical behaviour",
        m:{fr:"Vérifier l'existence d'un canal de signalement sécurisé (ligne d'alerte) et la protection des lanceurs d'alerte.",en:"Check for a secure reporting channel (whistleblower hotline) and whistleblower protection."}},
       {fr:"Codes de conduite, d'éthique et règles de déclaration financière",en:"Codes of conduct/ethics and financial disclosure rules",
        m:{fr:"Vérifier l'existence de codes de conduite ou d'éthique et d'obligations de déclaration de patrimoine ou d'intérêts.",en:"Check for codes of conduct/ethics and asset or interest declaration requirements."}}
     ]}
   ]}
];

let lang = "fr";
const STATUSES = ["green","yellow","red","na"];
const STATUS_COLOR = { green:"#0ca30c", yellow:"#fab219", red:"#d03b3b", na:"#898781" };
const state = {};
pillars.forEach(p => p.indicators.forEach((ind,ii) => ind.subs.forEach((_,si) => { state[p.key+"-"+ii+"-"+si] = null; })));

const textRefs = [];
const methodRefs = [];
const wrap = document.getElementById("pillars");
const jump = document.getElementById("jumpnav");

pillars.forEach(p => {
  const jbtn = document.createElement("button");
  jbtn.type = "button";
  jbtn.addEventListener("click", () => document.getElementById("sec-"+p.key).scrollIntoView({behavior:"smooth", block:"start"}));
  jump.appendChild(jbtn);
  textRefs.push({el: jbtn, text: p.short});

  const section = document.createElement("div");
  section.id = "sec-"+p.key;
  const h = document.createElement("p");
  h.className = "pillar-title";
  section.appendChild(h);
  textRefs.push({el: h, text: p.name});

  p.indicators.forEach((ind,ii) => {
    const indHead = document.createElement("p");
    indHead.className = "indicator-title";
    section.appendChild(indHead);
    textRefs.push({el: indHead, text: ind.name});

    ind.subs.forEach((label,si) => {
      const id = p.key+"-"+ii+"-"+si;
      const row = document.createElement("div");
      row.className = "row";

      const labWrap = document.createElement("div");
      labWrap.className = "lab-wrap";
      const lab = document.createElement("span");
      lab.className = "lab";
      labWrap.appendChild(lab);
      textRefs.push({el: lab, text: label});
      methodRefs.push({el: lab, method: label.m});

      const q = document.createElement("span");
      q.textContent = "?";
      q.className = "qmark";
      labWrap.appendChild(q);
      methodRefs.push({el: q, method: label.m});

      row.appendChild(labWrap);

      const seg = document.createElement("div");
      seg.className = "seg";
      STATUSES.forEach(st => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.status = st;
        btn.textContent = st === "na" ? "N/A" : "";
        btn.style.width = st === "na" ? "34px" : "22px";
        btn.addEventListener("click", () => {
          state[id] = state[id] === st ? null : st;
          seg.querySelectorAll("button").forEach((b) => {
            const bst = b.dataset.status;
            const active = state[id] === bst;
            b.style.background = active ? STATUS_COLOR[bst] : "#fff";
            b.style.borderColor = active ? STATUS_COLOR[bst] : "var(--border-strong)";
            b.style.color = active ? "#ffffff" : "var(--text-secondary)";
          });
          update();
        });
        seg.appendChild(btn);
      });
      row.appendChild(seg);
      section.appendChild(row);
    });
  });
  wrap.appendChild(section);
});

function applyStaticText() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("badge").textContent = t.badge;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("hint").textContent = t.hint;
  document.getElementById("legend-green").textContent = t.legend.green;
  document.getElementById("legend-yellow").textContent = t.legend.yellow;
  document.getElementById("legend-red").textContent = t.legend.red;
  document.getElementById("legend-na").textContent = t.legend.na;
  document.getElementById("stat-total-label").textContent = t.stat.total;
  document.getElementById("stat-green-label").textContent = t.stat.green;
  document.getElementById("stat-yellow-label").textContent = t.stat.yellow;
  document.getElementById("stat-red-label").textContent = t.stat.red;
  document.getElementById("footer-note").textContent = t.footer;
  document.getElementById("lang-toggle-label").textContent = t.toggleTo;
  textRefs.forEach(r => { r.el.textContent = r.text[lang]; });
  methodRefs.forEach(r => { r.el.title = r.method[lang]; });
  document.querySelectorAll("[data-status]").forEach(b => { b.title = t.legend[b.dataset.status]; });
  if (chart) { chart.data.labels = pillars.map(p => p.short[lang]); chart.update(); }
}

document.getElementById("lang-toggle").addEventListener("click", () => {
  lang = lang === "fr" ? "en" : "fr";
  applyStaticText();
});

let chart;
function update() {
  let g=0,y=0,r=0,total=0;
  const perPillar = pillars.map(() => ({g:0,y:0,r:0}));
  const redFlags = [];
  pillars.forEach((p,pi) => p.indicators.forEach((ind,ii) => ind.subs.forEach((label,si) => {
    const v = state[p.key+"-"+ii+"-"+si];
    if (v === "green") { g++; perPillar[pi].g++; total++; }
    else if (v === "yellow") { y++; perPillar[pi].y++; total++; }
    else if (v === "red") { r++; perPillar[pi].r++; total++; redFlags.push(p.short[lang] + " — " + label[lang]); }
    else if (v === "na") { total++; }
  })));

  document.getElementById("stat-total").textContent = total + "/55";
  document.getElementById("stat-green").textContent = g;
  document.getElementById("stat-yellow").textContent = y;
  document.getElementById("stat-red").textContent = r;

  const rf = document.getElementById("red-flags");
  if (redFlags.length) {
    rf.innerHTML = "<p style=\"font-weight:600;color:#d03b3b;margin:0 0 4px;\">" + T[lang].redFlagsPrefix + "</p>" +
      redFlags.map(t => "<p style=\"color:var(--text-secondary);\">• " + t + "</p>").join("");
  } else {
    rf.innerHTML = "";
  }

  if (chart) {
    chart.data.datasets[0].data = perPillar.map(x => x.g);
    chart.data.datasets[1].data = perPillar.map(x => x.y);
    chart.data.datasets[2].data = perPillar.map(x => x.r);
    chart.update();
  }
}

const ctx = document.getElementById("matrix");
chart = new Chart(ctx, {
  type: "bar",
  data: {
    labels: pillars.map(p => p.short[lang]),
    datasets: [
      { label: "Compliant", data: pillars.map(()=>0), backgroundColor: "#0ca30c" },
      { label: "Gap", data: pillars.map(()=>0), backgroundColor: "#fab219" },
      { label: "Substantial gap", data: pillars.map(()=>0), backgroundColor: "#d03b3b" }
    ]
  },
  options: {
    indexAxis: "y",
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      x: { stacked: true, ticks: { color: "#898781", precision: 0 }, grid: { color: "#e1e0d9" } },
      y: { stacked: true, ticks: { color: "#16181C" }, grid: { display: false } }
    },
    plugins: { legend: { display: false } }
  }
});
applyStaticText();
update();
</script>
</body>
